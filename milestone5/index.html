<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Philadelphia Eagles Fan Site</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="grid-container">
    <header class="header">
        <div class="nav-wrapper">
            <img src="../images/logo.svg" alt="logo" class="small-logo">

            <nav>
                <a href="#">Home</a>
                <a href="#">Highlights</a>
                <a href="#">Roster</a>
                <a href="#">Team History</a>
                <a href="#">Fun Facts</a>
            </nav>
        </div>
    </header>
    <section class="hero">
        <h1>GO BIRDS</h1>
    </section>
    <section class="logo">
        <img src="../images/logo.svg" alt="Eagles logo">
    </section>
    <section class="title">
        <h2>Philadelphia Eagles Fan Site</h2>
    </section>
    <section class="cards">

        <div class="card">
            <img src="../images/highlights.jpg" alt="Highlights">
            <p>HIGHLIGHTS</p>
        </div>

        <div class="card">
            <img src="../images/roster.jpg" alt="Team Roster">
            <p>ROSTER</p>
        </div>

        <div class="card">
            <img src="../images/history.jpg" alt="Team History">
            <p>TEAM HISTORY</p>
        </div>

        <div class="card">
            <img src="../images/funfacts.png" alt="Fun Facts">
            <p>FUN FACTS</p>
        </div>

       
<div class="card">
    <a href="https://youtu.be/IvJX0jczYD0?si=JuaIHUNwK4N1gnr2" target="_blank">
        <img src="../images/hype.jpg" alt="Hype Video">
    </a>
    <p>2025 HYPE VIDEO</p>
</div>

    </section>

</div>

</body>
</html>
